name: mod-catalog

include:
  - ./src/grocerices-api/docker-compose.yml

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-8012}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_started
      catalog-api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./src/client
    restart: unless-stopped
